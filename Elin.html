<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Para Elin</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Great+Vibes&family=Tenor+Sans&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
*{-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-touch-callout:none;animation-play-state:var(--anim-state)!important}
:root{
  --gold:#ffd200;--deep:#ffe066;
  --stem:#3d6e18;--stem2:#5a9222;--leaf:#4a8020;
  --dark:#03040a;--red1:#150003;--red2:#350008;
  --ff-display:'Playfair Display',serif;
  --ff-script:'Great Vibes',cursive;
  --ff-sans:'Tenor Sans',sans-serif;
  --anim-state:running;
}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:var(--ff-sans);-webkit-tap-highlight-color:transparent;}
img,video{pointer-events:none;-webkit-user-drag:none;}

/* ══ PHASE 2 — DRAMA ════════════════════════════ */
#phase-drama{
  position:fixed;inset:0;z-index:90;
  background:radial-gradient(ellipse at 50% 55%,var(--red2) 0%,var(--red1) 45%,#000 100%);
  opacity:0;pointer-events:none;
  transition:opacity 1.8s ease;
  overflow:hidden;
}
#phase-drama.in{opacity:1;pointer-events:all;}
#phase-drama.out{opacity:0;pointer-events:none;}

#drama-grain{
  position:absolute;inset:0;pointer-events:none;z-index:1;opacity:.05;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  animation:grainShift .2s steps(1) infinite;
}
@keyframes grainShift{
  0%{transform:translate(0,0)}20%{transform:translate(-2%,-3%)}40%{transform:translate(3%,2%)}
  60%{transform:translate(-1%,3%)}80%{transform:translate(2%,-2%)}100%{transform:translate(-1%,1%)}
}
#drama-scan{position:absolute;inset:0;pointer-events:none;z-index:2;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.05) 3px,rgba(0,0,0,.05) 4px);}
#drama-vign{position:absolute;inset:0;pointer-events:none;z-index:3;
  background:radial-gradient(ellipse at center,transparent 30%,rgba(0,0,0,.72) 100%);}

/* Photo grid background */
#photo-bg{
  position:absolute;inset:0;z-index:0;
  display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);
  gap:1px;overflow:hidden;background:#000;
}
.pbg-img{
  width:100%;height:100%;object-fit:cover;
  filter:blur(1px) brightness(.52) saturate(.72);
  transform:scale(1.04);
  transition:filter 3s ease;
}
#phase-drama.climax .pbg-img{filter:blur(0px) brightness(.7) saturate(.95);}

/* Big background heart */
#bg-heart{
  position:absolute;z-index:4;left:50%;top:50%;
  transform:translate(-50%,-52%);
  width:min(88vw,540px);height:min(88vw,540px);
  pointer-events:none;opacity:.06;
  transition:opacity 1.2s ease;
}
#phase-drama.climax #bg-heart{opacity:.2;}

/* Foreground heart positioned center-bottom */
#fg-heart{
  position:absolute;z-index:11;
  left:50%;bottom:clamp(20px,6vh,55px);
  transform:translateX(-50%);
  pointer-events:none;
  transition:transform .1s ease;
}
/* Heart pulsing fast at climax via class */
#fg-heart.fast-beat{animation:fhFastBeat .42s ease-in-out infinite;}
@keyframes fhFastBeat{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.18)}}

/* Text stage */
#drama-text{
  position:absolute;inset:0;z-index:10;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(6px,2vh,22px);
  padding:clamp(1.2rem,5vw,3.5rem) clamp(1.2rem,5vw,3.5rem) clamp(80px,14vh,130px);
  text-align:center;pointer-events:none;overflow:hidden;
}
.stage-block{
  display:flex;flex-direction:column;align-items:center;
  gap:clamp(4px,1.2vh,14px);
  opacity:0;transform:translateY(20px);
  transition:opacity 1.4s ease,transform 1.4s ease;
  pointer-events:none;
  max-width:min(760px,90vw);
}
.stage-block.vis{opacity:1;transform:none;}
/* Out-animation for prev blocks */
.stage-block.out{opacity:0;transform:translateY(-14px);transition:opacity .8s ease,transform .8s ease;}

.sl-label{
  font-family:var(--ff-sans);font-size:clamp(.48rem,1vw,.62rem);
  letter-spacing:.58em;text-transform:uppercase;color:rgba(200,70,70,.5);
}
.sl-big{
  font-family:var(--ff-script);font-size:clamp(2.2rem,7vw,5.5rem);
  color:#fff;line-height:1.12;
  text-shadow:0 0 30px rgba(255,40,60,.65),0 0 80px rgba(180,0,20,.3);
}
.sl-story{
  font-family:var(--ff-display);font-style:italic;font-weight:400;
  font-size:clamp(.88rem,2.2vw,1.4rem);
  color:rgba(255,195,195,.72);
  text-shadow:0 0 18px rgba(255,50,70,.3);
  line-height:1.75;
}
.sl-med{
  font-family:var(--ff-display);font-style:italic;font-weight:400;
  font-size:clamp(1.05rem,3vw,2.1rem);
  color:rgba(255,210,210,.82);
  text-shadow:0 0 24px rgba(255,60,80,.4),0 0 60px rgba(180,0,20,.18);
  line-height:1.65;
}
.sl-sm{
  font-family:var(--ff-sans);font-weight:300;
  font-size:clamp(.62rem,1.3vw,.84rem);
  letter-spacing:.22em;color:rgba(255,160,160,.45);text-transform:uppercase;
}
.sl-name{
  font-family:var(--ff-script);font-weight:400;
  font-size:clamp(3rem,10vw,7.5rem);color:#fff;letter-spacing:.04em;
  line-height:1.1;
  text-shadow:
    0 0 18px rgba(255,100,120,.95),
    0 0 50px rgba(210,0,30,.65),
    0 0 110px rgba(150,0,20,.35),
    0 2px 8px rgba(0,0,0,.6);
}
.sl-divider{
  width:clamp(50px,12vw,160px);height:1px;
  background:linear-gradient(to right,transparent,rgba(210,60,60,.45),transparent);
  margin:4px 0;
}
.sl-final{
  font-family:var(--ff-script);font-weight:400;
  font-size:clamp(1.5rem,4.5vw,3.2rem);
  color:rgba(255,225,225,.9);
  text-shadow:0 0 26px rgba(255,80,100,.55),0 0 60px rgba(180,0,20,.28);
  line-height:1.45;
}

/* ── Letter-by-letter light-up ── */
.lc{
  opacity:0;display:inline;
}
.lc.lit{
  opacity:1;
  animation:charGlow 2.2s ease forwards;
}
@keyframes charGlow{
  0%  {color:#fff;text-shadow:0 0 22px rgba(255,220,220,1),0 0 50px rgba(255,80,100,1),0 0 90px rgba(200,20,40,.7);}
  35% {color:inherit;text-shadow:0 0 12px rgba(255,130,130,.55);}
  100%{text-shadow:inherit;}
}

/* ── Tap/click hint ── */
#tap-hint{
  position:absolute;bottom:clamp(18px,4vh,42px);left:50%;transform:translateX(-50%);
  z-index:25;
  font-family:var(--ff-sans);font-size:clamp(.5rem,1vw,.62rem);
  letter-spacing:.42em;text-transform:uppercase;
  color:rgba(255,160,160,0);
  pointer-events:none;
  transition:color .6s ease;
  animation:tapHintBlink 2.2s ease-in-out infinite;
}
#tap-hint.vis{color:rgba(255,160,160,.38);}
@keyframes tapHintBlink{
  0%,100%{opacity:.3}50%{opacity:.85}
}

/* ══ PHASE 3 — FLOWER SCENE ══════════════════════ */
#phase-scene{
  position:fixed;inset:0;z-index:80;
  opacity:0;pointer-events:none;transition:opacity 1.8s ease;
}
#phase-scene.in{opacity:1;pointer-events:all;}
#sky{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 90% 65% at 50% 0%,#0b1228 0%,#050c1a 50%,var(--dark) 100%)}
#star-cv{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity 3.5s ease .5s}
#star-cv.on{opacity:1}
.moon{position:fixed;z-index:2;pointer-events:none;top:clamp(14px,4.5vh,50px);right:clamp(14px,5.5vw,70px);
  width:clamp(34px,5vw,60px);height:clamp(34px,5vw,60px);border-radius:50%;
  background:radial-gradient(circle at 38% 38%,#fffde7 0%,#ffe57f 55%,#ffb300 100%);
  box-shadow:0 0 clamp(12px,2vw,32px) clamp(4px,.7vw,9px) rgba(255,220,80,.28),
             0 0 clamp(30px,5vw,80px) clamp(10px,2vw,30px) rgba(255,180,0,.1);
  animation:mfloat 9s ease-in-out infinite;}
@keyframes mfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.shoot{position:fixed;z-index:2;pointer-events:none;width:3px;height:3px;border-radius:50%;
  background:#fff;box-shadow:0 0 6px 2px rgba(255,255,255,.8);opacity:0;animation:sanim linear infinite;}
.shoot::after{content:'';position:absolute;top:50%;right:0;transform:translateY(-50%);width:88px;height:1.5px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.88));}
@keyframes sanim{0%{opacity:0;transform:translate(0,0) rotate(32deg)}8%{opacity:1}88%{opacity:1}100%{opacity:0;transform:translate(115vw,44vh) rotate(32deg)}}
#ground{position:fixed;bottom:0;left:0;right:0;z-index:3;height:clamp(55px,11vh,130px);}
#ground-fill{position:absolute;bottom:0;left:0;right:0;height:100%;background:linear-gradient(to top,#0a1a03 0%,#132005 25%,#1c2f08 60%,transparent 100%);}
#grass-svg{position:absolute;top:0;left:0;right:0;width:100%;transform:translateY(-32%);pointer-events:none;overflow:visible;}
#grass-blades{position:absolute;top:0;left:0;right:0;transform:translateY(-28%);pointer-events:none;width:100%;height:clamp(28px,6.5vh,65px);}
.gb{position:absolute;bottom:0;transform-origin:bottom center;will-change:transform;animation:swayGrass ease-in-out infinite;}
@keyframes swayGrass{0%,100%{transform:rotate(var(--gr-r))}50%{transform:rotate(var(--gr-r2))}}
#particles{position:fixed;inset:0;z-index:4;pointer-events:none;overflow:hidden}
.pt{position:absolute;border-radius:50%;opacity:0;will-change:transform,opacity;
  background:radial-gradient(circle,#fffde7 0%,#ffd700 55%,#ffb300 100%);
  box-shadow:0 0 8px rgba(255,200,0,.85);animation:ptrise linear infinite;}
@keyframes ptrise{0%{transform:translate(0,4vh) scale(.6);opacity:0}10%{opacity:.9}65%{opacity:.55}100%{transform:translate(var(--dx,0px),-108vh) scale(1.4);opacity:0}}
#flowers{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(1200px,100vw);height:100vh;z-index:5;pointer-events:none;}
.fl{position:absolute;bottom:clamp(34px,8.5vh,108px);display:flex;flex-direction:column;align-items:center;
  transform-origin:bottom center;will-change:transform,opacity;opacity:0;}
.fl.grow{animation:flowerGrowIn 2.8s cubic-bezier(.22,1,.36,1) var(--gd,0s) forwards,var(--sw,sw1) var(--sdur,5s) ease-in-out calc(var(--gd,0s) + 2.9s) infinite;}
@keyframes flowerGrowIn{0%{opacity:0;transform:scaleY(0) translateY(8px)}40%{opacity:.7}100%{opacity:1;transform:scaleY(1) translateY(0)}}
@keyframes sw1{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3.5deg)}}
@keyframes sw2{0%,100%{transform:rotate(4deg)}50%{transform:rotate(-3deg)}}
@keyframes sw3{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(2deg)}}
@keyframes sw4{0%,100%{transform:rotate(2.5deg)}50%{transform:rotate(-5deg)}}
@keyframes sw5{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(5deg)}}
@keyframes stemGrow{0%{height:0;opacity:0}100%{opacity:1}}
@keyframes bloomIn{0%{transform:scale(0) translateY(35px);opacity:0;filter:blur(8px)}60%{filter:blur(0)}100%{transform:none;opacity:1}}
@keyframes leafOpenL{from{transform:rotate(-42deg) skewX(-8deg) scaleX(0);opacity:0}}
@keyframes leafOpenR{from{transform:rotate(42deg) skewX(8deg) scaleX(0);opacity:0}}
@keyframes petalPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.1)}}
@keyframes spk{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--sx),var(--sy)) scale(0)}}
.stem{position:relative;border-radius:3px 3px 2px 2px;
  background:linear-gradient(to right,#1a3508 0%,var(--stem) 38%,var(--stem2) 62%,#1a3508 100%);
  box-shadow:inset -2px 0 5px rgba(0,0,0,.4),3px 0 9px rgba(55,110,15,.2);
  transform-origin:bottom center;animation:stemGrow 2.2s cubic-bezier(.16,1,.3,1) var(--sdd,0s) both;}
.leaf{position:absolute;background:linear-gradient(135deg,var(--stem2),var(--leaf));box-shadow:inset 0 0 6px rgba(0,0,0,.3)}
.leaf-l{border-radius:100% 0 100% 0;transform-origin:bottom right;animation:leafOpenL 1.4s cubic-bezier(.16,1,.3,1) var(--ldd,1.5s) both}
.leaf-r{border-radius:0 100% 0 100%;transform-origin:bottom left;animation:leafOpenR 1.4s cubic-bezier(.16,1,.3,1) var(--ldd2,1.8s) both}
.head{position:relative;animation:bloomIn 1.8s cubic-bezier(.16,1,.3,1) var(--bdd,1.5s) both}
.petals-wrap{position:relative;display:flex;align-items:flex-end;justify-content:center}
.petal{position:absolute;bottom:0;left:50%;transform-origin:bottom center;animation:petalPulse 5s ease-in-out infinite;animation-delay:var(--pdd,0s);}
.petal svg{display:block}
.stamen{position:absolute;z-index:5;border-radius:50%;background:radial-gradient(circle at 40% 40%,#fffde7,#ffc300)}
.head-glow{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(ellipse,rgba(255,215,0,.28) 0%,transparent 70%);animation:gp 3.5s ease-in-out infinite;}
@keyframes gp{0%,100%{opacity:.3}50%{opacity:.9}}
.sparkle{position:absolute;border-radius:50%;background:radial-gradient(circle,#fffde7,#ffd700);
  box-shadow:0 0 6px rgba(255,200,0,.9);animation:spk ease-out forwards;opacity:0;}
#overlay-text{position:fixed;z-index:20;top:clamp(10px,3vh,32px);left:0;right:0;
  display:flex;flex-direction:column;align-items:center;gap:clamp(4px,.8vh,8px);pointer-events:none;}
#main-text{font-family:var(--ff-script);font-size:clamp(1.1rem,3.8vw,2.6rem);color:var(--deep);
  text-shadow:0 0 18px rgba(255,210,0,.6),0 0 55px rgba(255,180,0,.2);
  text-align:center;padding:0 1.2rem;opacity:0;animation:fadeup 2.2s ease .5s forwards;}
#main-text-sub{font-family:var(--ff-sans);font-size:clamp(.46rem,1vw,.6rem);color:rgba(255,210,0,.36);
  letter-spacing:.5em;text-transform:uppercase;opacity:0;animation:fadeup 2s ease 1.2s forwards;}
@keyframes fadeup{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
.gif-float{position:fixed;z-index:15;border-radius:18px;overflow:hidden;animation:gifFloat linear;opacity:0;will-change:transform,opacity;}
.gif-float img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;}
@keyframes gifFloat{0%{opacity:0;transform:translateY(0) rotate(var(--gr,0deg)) scale(.85)}8%{opacity:.88}78%{opacity:.75}100%{opacity:0;transform:translateY(var(--gy,-80vh)) rotate(var(--gr2,8deg)) scale(1.05)}}
#lyr-wrap{position:fixed;z-index:20;right:clamp(14px,3vw,38px);top:50%;transform:translateY(-50%);
  width:clamp(200px,24vw,300px);display:flex;flex-direction:column;pointer-events:none;}
#lyr-label{font-family:var(--ff-sans);font-size:.48rem;letter-spacing:.42em;text-transform:uppercase;
  color:rgba(255,210,0,.2);text-align:center;margin-bottom:.6rem;}
@media(max-width:720px){
  #lyr-wrap{right:auto;top:38%;left:50%;transform:translate(-50%,-50%);
    width:min(92vw,420px);background:none;border:none;backdrop-filter:none;padding:0;}
  #lyr-label{display:none;}
}
#lyr-scroll{overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column;gap:0;
  max-height:clamp(180px,50vh,480px);padding:1.1rem .5rem;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 16%,#000 84%,transparent 100%);
  mask-image:linear-gradient(to bottom,transparent 0%,#000 16%,#000 84%,transparent 100%);}
@media(max-width:720px){#lyr-scroll{max-height:clamp(110px,18vh,170px);padding:.6rem .4rem;}}
#lyr-scroll::-webkit-scrollbar{display:none}
.ll{font-family:var(--ff-display);font-size:clamp(.82rem,1.7vw,1.05rem);font-weight:400;
  color:rgba(255,230,130,.15);line-height:1.88;padding:.18rem .5rem;border-radius:6px;text-align:center;
  transition:color .4s,font-size .3s,transform .3s,background .3s,text-shadow .4s;letter-spacing:.01em;}
.ll.past{color:rgba(255,230,130,.11);}
.ll.prev{color:rgba(255,230,130,.3);font-size:clamp(.78rem,1.52vw,.95rem);font-style:italic;}
.ll.active{color:#fffbe0;font-size:clamp(.96rem,2.1vw,1.26rem);font-style:italic;font-weight:700;letter-spacing:.02em;
  text-shadow:0 0 14px rgba(255,215,0,1),0 0 32px rgba(255,190,0,.75),0 0 72px rgba(255,160,0,.35);
  transform:scale(1.05);background:linear-gradient(90deg,transparent,rgba(255,210,0,.07),transparent);}
.ll.next{color:rgba(255,230,130,.2);font-size:clamp(.8rem,1.58vw,.98rem);}
.ll.empty{min-height:.9rem;pointer-events:none}
.lyr-empty{display:flex;align-items:center;justify-content:center;height:55px;font-family:var(--ff-sans);
  font-size:.64rem;font-weight:300;color:rgba(255,210,0,.28);letter-spacing:.2em;text-transform:uppercase;}
#modal-carta{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.84);backdrop-filter:blur(14px);}
#modal-carta.open{display:flex;animation:cfadein .4s ease}
@keyframes cfadein{from{opacity:0}to{opacity:1}}
.carta-box{background:linear-gradient(135deg,rgba(40,30,0,.95),rgba(20,14,0,.98));
  border:1px solid rgba(255,210,0,.2);border-radius:28px;padding:clamp(1.5rem,4vw,2.5rem);
  max-width:min(520px,90vw);max-height:85vh;overflow-y:auto;
  box-shadow:0 0 70px rgba(255,180,0,.2),inset 0 0 35px rgba(255,200,0,.04);
  text-align:center;animation:cboxin .6s cubic-bezier(.16,1,.3,1);}
@keyframes cboxin{from{transform:scale(.86) translateY(28px);opacity:0}to{transform:none;opacity:1}}
.carta-icon{font-family:var(--ff-script);font-size:1.8rem;margin-bottom:.8rem;display:block;color:var(--gold);}
.carta-text{font-family:var(--ff-script);font-size:clamp(1.3rem,3.5vw,2rem);color:#fff9e6;line-height:1.7;}
.carta-close{margin-top:1.6rem;font-family:var(--ff-sans);font-size:.56rem;letter-spacing:.28em;text-transform:uppercase;
  padding:.55rem 2.2rem;border-radius:30px;background:rgba(255,200,0,.06);border:1px solid rgba(255,200,0,.18);
  color:rgba(255,220,120,.5);cursor:pointer;transition:all .2s;display:block;margin-left:auto;margin-right:auto;}
.carta-close:hover{background:rgba(255,200,0,.18);color:#ffe066}
#vignette-scene{position:fixed;inset:0;z-index:6;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 28%,rgba(3,4,10,.78) 100%);}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ══ START SCREEN ═══════════════════════════════ */
#start-screen{
  position:fixed;inset:0;z-index:300;
  background:#000;
  display:flex;align-items:center;justify-content:center;
  transition:opacity 1s ease;
}
#start-screen.gone{opacity:0;pointer-events:none;}
#start-inner{
  display:flex;flex-direction:column;align-items:center;
  gap:clamp(18px,4vh,36px);
}
#start-title{
  font-family:var(--ff-script);
  font-size:clamp(2rem,7vw,4.5rem);
  color:rgba(255,200,200,.6);
  text-shadow:0 0 30px rgba(180,0,20,.4);
  letter-spacing:.04em;
  animation:startTitlePulse 3s ease-in-out infinite;
}
@keyframes startTitlePulse{
  0%,100%{opacity:.5;text-shadow:0 0 20px rgba(180,0,20,.3);}
  50%{opacity:.85;text-shadow:0 0 40px rgba(220,30,50,.6),0 0 80px rgba(160,0,20,.25);}
}
#start-btn{
  font-family:var(--ff-sans);
  font-size:clamp(.7rem,1.5vw,.9rem);
  letter-spacing:.45em;
  text-transform:uppercase;
  color:rgba(255,180,180,.6);
  background:none;
  border:1px solid rgba(200,60,60,.3);
  padding:.7rem 2.6rem;
  border-radius:30px;
  cursor:pointer;
  transition:all .35s ease;
}
#start-btn:hover,#start-btn:active{
  color:rgba(255,210,210,.9);
  border-color:rgba(200,60,60,.7);
  box-shadow:0 0 20px rgba(180,20,20,.3);
}
</style>
</head>
<body>

/* ══ AUDIO ENGINE ════════════════════════════════ */
let AC=null,hbGain=null,hbInterval=null,hbBPM=72;
const pinkMatter=$('pink-matter');

function initAC(){
  if(AC)return;
  AC=new(window.AudioContext||window.webkitAudioContext)();
  hbGain=AC.createGain();hbGain.gain.value=0;
  hbGain.connect(AC.destination);
}
function thump(t,vol,f1,f2){
  const o1=AC.createOscillator(),g1=AC.createGain();
  o1.type='sine';o1.frequency.setValueAtTime(f1,t);
  o1.frequency.exponentialRampToValueAtTime(26,t+.24);
  g1.gain.setValueAtTime(0,t);g1.gain.linearRampToValueAtTime(vol,t+.022);
  g1.gain.exponentialRampToValueAtTime(.001,t+.24);
  o1.connect(g1);g1.connect(hbGain);o1.start(t);o1.stop(t+.27);

  const o2=AC.createOscillator(),g2=AC.createGain();
  o2.type='triangle';o2.frequency.setValueAtTime(f2,t);
  g2.gain.setValueAtTime(0,t);g2.gain.linearRampToValueAtTime(vol*.4,t+.028);
  g2.gain.exponentialRampToValueAtTime(.001,t+.19);
  o2.connect(g2);g2.connect(hbGain);o2.start(t);o2.stop(t+.22);
}
function beatNow(){
  if(!AC)return;
  const n=AC.currentTime;
  thump(n,.34,68,54);thump(n+.2,.5,56,43);
}
function startHeartbeat(bpm=72,vol=.5){
  hbBPM=bpm;
  if(hbInterval)clearInterval(hbInterval);
  if(!AC)return;
  if(AC.state==='suspended')AC.resume();
  hbGain.gain.setTargetAtTime(vol,AC.currentTime,.6);
  beatNow();
  hbInterval=setInterval(()=>{beatNow();},Math.round(60000/hbBPM));
}
function setHBSpeed(bpm,vol){
  hbBPM=bpm;
  if(hbInterval)clearInterval(hbInterval);
  hbInterval=setInterval(()=>{beatNow();},Math.round(60000/hbBPM));
  if(vol!==undefined&&hbGain) hbGain.gain.setTargetAtTime(vol,AC.currentTime,.4);
}
function setHeartVol(vol,ramp=1){
  if(!hbGain)return;
  hbGain.gain.setTargetAtTime(vol,AC.currentTime,ramp);
}
function stopHeartbeat(){
  if(hbInterval){clearInterval(hbInterval);hbInterval=null;}
  if(hbGain) hbGain.gain.setTargetAtTime(0,AC.currentTime,1.2);
}

const CLIMAX_STAGE_IDX = 9;   // stage index that triggers climax
const HEAL_STAGE_IDX   = 12;  // stage index that triggers heart heal
const FAST_BEAT_IDX    = 11;  // stage index that speeds heartbeat

let activeBlock=null;
let currentStageIdx=-1;
let charLightTimeout=null;
let lightUpDone=false;
let tapHintTimer=null;

function buildStageBlock(lines){
  const block=document.createElement('div');
  block.className='stage-block';
  lines.forEach(({cls,t})=>{
    if(cls==='sl-divider'){
      const d=document.createElement('div');d.className='sl-divider';block.appendChild(d);
    } else {
      const el=document.createElement('div');el.className=cls;
      [...t].forEach(ch=>{
        const sp=document.createElement('span');sp.className='lc';
        sp.textContent=ch;el.appendChild(sp);
      });
      block.appendChild(el);
    }
  });
  return block;
}

function lightUpBlock(block,onDone){
  const chars=block.querySelectorAll('.lc');
  // Vary speed by line type: big/name slower (35ms), story faster (22ms)
  const baseSpeed=chars.length>120?18:chars.length>60?22:28;
  chars.forEach((c,i)=>{
    setTimeout(()=>{
      c.classList.add('lit');
      if(i===chars.length-1 && onDone) setTimeout(onDone,300);
    }, i*baseSpeed);
  });
  // Total duration estimate
  return chars.length*baseSpeed;
}

function showStage(idx){
  if(idx>=textStages.length){
    // All stages done → advance to flower scene
    advanceToScene();
    return;
  }
  currentStageIdx=idx;
  lightUpDone=false;
  clearTimeout(tapHintTimer);
  $('tap-hint').classList.remove('vis');

  const stage=textStages[idx];
  const cont=$('drama-text');

  // Fade out current block
  if(activeBlock){
    activeBlock.classList.add('out');
    const old=activeBlock;
    setTimeout(()=>{if(old.parentNode)old.parentNode.removeChild(old);},800);
  }

  const block=buildStageBlock(stage.lines);
  cont.appendChild(block);
  activeBlock=block;

  // Trigger side effects for this stage
  if(idx===CLIMAX_STAGE_IDX) $('phase-drama').classList.add('climax');
  if(idx===FAST_BEAT_IDX){ setHBSpeed(110,1.1);$('fg-heart').classList.add('fast-beat'); }
  if(idx===HEAL_STAGE_IDX){ healHeart();setTimeout(()=>{setHBSpeed(72,.7);$('fg-heart').classList.remove('fast-beat');},4000); }

  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    block.classList.add('vis');
    // Light up chars after block fades in
    setTimeout(()=>{
      const dur=lightUpBlock(block,()=>{
        lightUpDone=true;
        // Show tap hint after light-up finishes (except last stage)
        if(idx<textStages.length-1){
          tapHintTimer=setTimeout(()=>$('tap-hint').classList.add('vis'),400);
        } else {
          // Last stage: auto-advance after 4s
          setTimeout(advanceToScene, 4000);
        }
      });
    },350);
  }));
}

function advanceToScene(){
  $('phase-drama').classList.add('out');
  $('tap-hint').classList.remove('vis');
  stopHeartbeat();
  fadePinkMatter(0,3000);
  setTimeout(()=>{
    $('phase-drama').style.display='none';
    launchFlowerScene();
  },1800);
}

// Click/tap anywhere on drama phase → next stage
$('phase-drama').addEventListener('click',()=>{
  if(currentStageIdx<0)return; // not started yet
  $('tap-hint').classList.remove('vis');
  clearTimeout(tapHintTimer);
  // Advance even if light-up isn't done — user is in control
  showStage(currentStageIdx+1);
},{passive:true});

function runDrama(){
  // Start heartbeat ramp
  setTimeout(()=>setHeartVol(.7,.8), 4000);
  setTimeout(()=>setHeartVol(.92,.8), 30000);

  // Show first stage after a short dramatic pause
  setTimeout(()=>showStage(0), 1200);
}

/* ══ HEART HEAL ══════════════════════════════════ */
function healHeart(){
  const L=$('fhL'),R=$('fhR'),crack=$('fhCrack'),band=$('fhBand'),glow=$('fhGlow');
  L.style.transform='translateX(0)';
  R.style.transform='translateX(0)';
  crack.style.opacity='0';
  crack.style.strokeDashoffset='75';
  band.style.opacity='1';
  band.style.strokeDashoffset='0';
  setTimeout(()=>{
    glow.style.transition='opacity .9s ease';
    glow.style.opacity='.9';
  }, 2000);
}

/* ══ PINK MATTER AUDIO ═══════════════════════════ */
function startPinkMatter(){
  pinkMatter.volume=0;
  pinkMatter.play().catch(()=>{});
  // Fade in over 4s
  fadePinkMatter(.45, 4000);
}
function fadePinkMatter(target, durationMs){
  const start=pinkMatter.volume;
  const diff=target-start;
  const steps=60;
  const step=durationMs/steps;
  let i=0;
  const t=setInterval(()=>{
    i++;
    pinkMatter.volume=Math.max(0,Math.min(1,start+diff*(i/steps)));
    if(i>=steps)clearInterval(t);
  },step);
}

/* ══ START BUTTON — goes straight to drama ═══════ */
$('start-btn').addEventListener('click',()=>{
  initAC();
  if(AC.state==='suspended') AC.resume();
  $('start-screen').classList.add('gone');
  setTimeout(()=>{
    $('start-screen').style.display='none';
    $('phase-drama').classList.add('in');
    startHeartbeat(72,.5);
    startPinkMatter();
    runDrama();
  }, 900);
},{once:true,passive:true});

/* ══ STAR CANVAS ════════════════════════════════ */
(()=>{
  const cv=$('star-cv'),ctx=cv.getContext('2d');
  let W,H;
  const resize=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight};
  resize();addEventListener('resize',resize,{passive:true});
  const n=mob()?100:185;
  const stars=Array.from({length:n},()=>({
    x:rnd(0,innerWidth),y:rnd(0,innerHeight*.8),
    r:rnd(.2,1.3),a:rnd(0,1),da:rnd(.0012,.004)*(Math.random()>.5?1:-1)
  }));
  let last=0;
  (function loop(ts){
    requestAnimationFrame(loop);
    if(ts-last<(mob()?58:38))return;last=ts;
    ctx.clearRect(0,0,W,H);
    for(const s of stars){
      s.a+=s.da;if(s.a>1||s.a<.04)s.da*=-1;
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,245,200,${s.a*.88})`;ctx.fill();
    }
  })(0);
})();

      <stop offset="0%"   stop-color="hsl(${hue+18},100%,${lig+22}%)"/>
      <stop offset="38%"  stop-color="hsl(${hue},100%,${lig}%)"/>
      <stop offset="100%" stop-color="hsl(${hue-12},90%,${lig-26}%)"/>
    </radialGradient></defs>
    <path d="M${w/2} ${h} C${w*.17} ${h*.77},${w*.03} ${h*.48},${w*.21} ${h*.21}
      C${w*.31} ${h*.05},${w/2} 0,${w/2} 0 C${w/2} 0,${w*.69} ${h*.05},${w*.79} ${h*.21}
      C${w*.97} ${h*.48},${w*.83} ${h*.77},${w/2} ${h}Z"
      fill="url(#${id})" stroke="hsl(${hue-8},80%,${lig-16}%)" stroke-width=".6" opacity="${op}"/>
    <path d="M${w/2} ${h*.88} C${w*.46} ${h*.5},${w*.47} ${h*.28},${w/2} ${h*.06}"
      stroke="rgba(255,255,255,.15)" stroke-width="${Math.max(w*.045,1)}" fill="none"/>

}

/* ══ LYRICS ══════════════════════════════════════ */
let lrcLines=[],curIdx=-1;
function parseLRC(raw){
  const re=/\[(\d{2}):(\d{2})\.(\d{1,3})\](.*)/;
  return raw.split('\n').map(l=>{const m=l.match(re);if(!m)return null;
    return{time:+m[1]*60+ +m[2]+ +m[3].padEnd(3,'0')/1000,text:m[4].trim()}})
    .filter(Boolean).sort((a,b)=>a.time-b.time);
}
function renderLyrics(){
  const sc=$('lyr-scroll');if(!sc)return;
  if(!lrcLines.length){sc.innerHTML='<div class="lyr-empty">sin letra sincronizada</div>';return;}
  const frag=document.createDocumentFragment();
  for(let i=0;i<4;i++){const d=document.createElement('div');d.className='ll empty';frag.appendChild(d);}
  lrcLines.forEach(l=>{
    const el=document.createElement('div');el.className='ll'+(l.text===''?' empty':'');
    el.textContent=l.text||' ';frag.appendChild(el);
  });
  for(let i=0;i<4;i++){const d=document.createElement('div');d.className='ll empty';frag.appendChild(d);}
  sc.innerHTML='';sc.appendChild(frag);
}
let lyrRAF=false,lastLyrT=-1;
function syncLyrics(t){
  if(!lrcLines.length||lyrRAF)return;
  if(Math.abs(t-lastLyrT)<.09)return;
  lastLyrT=t;lyrRAF=true;
  requestAnimationFrame(()=>{
    lyrRAF=false;
    let idx=-1;
    for(let i=0;i<lrcLines.length;i++){if(lrcLines[i].time<=t+.22)idx=i;else break;}
    if(idx===curIdx)return;curIdx=idx;
    const sc=$('lyr-scroll');if(!sc)return;
    const pad=4,els=sc.querySelectorAll('.ll');
    els.forEach((el,i)=>{
      const ri=i-pad;
      const want=ri===idx?'active':ri===idx-1?'prev':(ri===idx+1||ri===idx+2)?'next':ri<idx?'past':'';
      const cur=['active','prev','next','past'].find(c=>el.classList.contains(c))||'';
      if(want!==cur){el.classList.remove('active','prev','next','past');if(want)el.classList.add(want);}
    });
    const activeEl=sc.querySelector('.ll.active');
    if(activeEl){
      const cRect=sc.getBoundingClientRect(),eRect=activeEl.getBoundingClientRect();
      sc.scrollTo({top:sc.scrollTop+(eRect.top-cRect.top)-(sc.clientHeight/2)+(activeEl.offsetHeight/2),behavior:'smooth'});
    }
  });
}
async function loadLyrics(){
  try{
    const r=await fetch('https://lrclib.net/api/get?artist_name=Floricienta&track_name=Flores+Amarillas');
    if(!r.ok)throw 0;
    const d=await r.json();
    if(d.syncedLyrics){lrcLines=parseLRC(d.syncedLyrics);renderLyrics();}
    else if(d.plainLyrics){
      lrcLines=d.plainLyrics.split('\n').filter(l=>l.trim()).map((text,i)=>({time:i*4.8,text}));
      renderLyrics();
    }else throw 0;
  }catch(e){$('lyr-scroll').innerHTML='<div class="lyr-empty">sin letra</div>';}
}
const aud=$('aud');
aud.addEventListener('timeupdate',()=>syncLyrics(aud.currentTime),{passive:true});
